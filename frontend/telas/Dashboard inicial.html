<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Inicial | Auxílio Transporte Estudantil</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --cor01: #1F3820;
            --cor02: #DDFADE;
            --cor03: #929E93;
            --cor04: #007615;
            --branco: #fff;
            --preto: #000;
            --fontCondensada: "Roboto Condensed", sans-serif;
            --fontRegular: "Roboto", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--fontRegular);
        }

        body {
            display: flex;
            height: 100vh;
            width: 100vw;
            background-color: #fafbfc;
            overflow: hidden;
        }

        /* Menu Lateral (Sidebar) */
        .sidebar {
            width: 280px;
            background-color: var(--branco);
            border-right: 1px solid #e1e8ed;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
        }

        .sidebar-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .brasao-menu {
            width: 75px;
            height: auto;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 18px;
            color: var(--cor03);
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .nav-item i {
            font-size: 1.1rem;
        }

        .nav-item:hover {
            background-color: #f0f7f1;
            color: var(--cor04);
        }

        .nav-item.active {
            background-color: var(--cor02);
            color: var(--cor01);
            font-weight: 600;
        }

        .sidebar-footer {
            border-top: 1px solid #e1e8ed;
            padding-top: 15px;
        }

        .nav-item.logout:hover {
            background-color: #ffebee;
            color: #d32f2f;
        }

        /* Área de Conteúdo Principal */
        .main-content {
            flex: 1;
            padding: 40px 60px;
            overflow-y: auto;
        }

        .content-header {
            margin-bottom: 35px;
        }

        .content-header h1 {
            font-family: var(--fontCondensada);
            font-size: 2.2rem;
            color: #555d56;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .content-header p {
            color: var(--cor03);
            font-size: 0.92rem;
        }

        /* Card Principal: Situação da Solicitação */
        .status-card {
            background-color: var(--branco);
            border: 1px solid #e1e8ed;
            border-radius: 16px;
            padding: 25px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 850px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(31, 56, 32, 0.03);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .status-card:hover {
            border-color: var(--cor03);
            box-shadow: 0 6px 20px rgba(31, 56, 32, 0.06);
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .status-icon-circle {
            width: 65px;
            height: 65px;
            background-color: #72d984;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--branco);
            font-size: 1.8rem;
            box-shadow: 0 4px 10px rgba(114, 217, 132, 0.3);
        }

        .status-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .status-label {
            font-size: 0.85rem;
            color: var(--cor03);
            font-weight: 500;
        }

        .status-title {
            font-family: var(--fontCondensada);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--cor01);
        }

        .status-desc {
            font-size: 0.82rem;
            color: var(--cor03);
            margin-top: 2px;
        }

        .status-arrow {
            font-size: 1.2rem;
            color: var(--cor03);
            margin-right: 10px;
        }

        /* Grelha de Cards Inferiores (Próxima atualização / Documentação) */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 850px;
        }

        .info-card {
            background-color: var(--branco);
            border: 1px solid #e1e8ed;
            border-radius: 16px;
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(31, 56, 32, 0.03);
        }

        .info-card-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7b8a7d;
            font-size: 1.3rem;
        }

        .info-card-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-card-title {
            font-size: 0.88rem;
            color: var(--cor03);
            font-weight: 500;
        }

        .info-card-value {
            font-family: var(--fontCondensada);
            font-size: 1.4rem;
            font-weight: 600;
            color: #555d56;
        }

        @media (max-width: 900px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                overflow-y: auto;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 15px 20px;
            }
            .sidebar-logo, .sidebar-footer {
                display: none;
            }
            .sidebar-nav {
                flex-direction: row;
                gap: 5px;
            }
            .nav-item {
                padding: 8px 12px;
                font-size: 0.85rem;
            }
            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="../assets/brasao curiuva.svg" alt="Brasão de Curiúva" class="brasao-menu">
        </div>

        <nav class="sidebar-nav">
            <a href="dashboardInicial.html" class="nav-item active">
                <i class="fa-solid fa-house"></i> Início
            </a>
            <a href="cadastroEstudante2.html" class="nav-item">
                <i class="fa-solid fa-file-pen"></i> Solicitações
            </a>
            <a href="documentos.html" class="nav-item">
                <i class="fa-solid fa-folder-open"></i> Documentos
            </a>
            <a href="perfil.html" class="nav-item">
                <i class="fa-solid fa-user"></i> Perfil
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="login.html" class="nav-item logout">
                <i class="fa-solid fa-right-from-bracket"></i> Sair
            </a>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <header class="content-header">
            <h1>Olá, Estudante!</h1>
            <p>Acompanhe aqui as suas solicitações.</p>
        </header>

        <!-- Card de Situação da Solicitação -->
        <a href="Dashboard da Solicitação1.html" class="status-card">
            <div class="status-left">
                <div class="status-icon-circle">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <div class="status-info">
                    <span class="status-label">Situação da solicitação</span>
                    <h2 class="status-title">Em análise</h2>
                    <p class="status-desc">Sua solicitação está sendo analisada pela Secretaria Municipal da Educação.</p>
                </div>
            </div>
            <div class="status-arrow">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </a>

        <!-- Grelha de Informações Adicionais -->
        <div class="info-grid">
            <div class="info-card">
                <div class="info-card-icon">
                    <i class="fa-regular fa-calendar-days"></i>
                </div>
                <div class="info-card-content">
                    <span class="info-card-title">Próxima atualização</span>
                    <span class="info-card-value">Janeiro/2027</span>
                </div>
            </div>

            <div class="info-card">
                <div class="info-card-icon">
                    <i class="fa-solid fa-folder"></i>
                </div>
                <div class="info-card-content">
                    <span class="info-card-title">Documentação</span>
                    <span class="info-card-value">Status: Completa</span>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
